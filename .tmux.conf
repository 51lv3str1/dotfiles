# 24-bit color, named terminals only. A blanket "*:Tc" also claims it for
# TERM=linux, the bare console, which has 16.
set -ga terminal-overrides ",xterm*:Tc,alacritty*:Tc,foot*:Tc,screen-256color:Tc,tmux-256color:Tc"

# Per pane, and only applied to panes opened after this is set.
set -g history-limit 20000

# Pane navigation without the prefix. -n binds to the root table.
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# C-l is now tmux's, so give the shell's clear-screen a home behind the prefix.
bind C-l send-keys 'C-l'

# Theme. The other flavours sit next to this one: macchiato, frappe, latte.
source-file ~/.config/tmux/catppuccin/mocha.conf
