# tmux configuration — self-contained, no plugin manager.
# Theme: Catppuccin Mocha, hand-written to match Alacritty + starship.

# ── Behaviour ────────────────────────────────────────────────────────────────
# True color: advertise a 256-color terminal and RGB capability so nvim's
# termguicolors renders correctly inside tmux (Alacritty supports RGB).
set -g  default-terminal "tmux-256color"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",xterm-256color:RGB"

set -g  mouse on               # click/scroll/resize with the mouse
set -g  base-index 1           # windows start at 1 (0 is far from the home row)
setw -g pane-base-index 1      # panes too
set -g  renumber-windows on    # keep window numbers gapless after closing one
set -g  history-limit 10000
set -sg escape-time 10         # don't swallow <Esc> (matters for nvim)
set -g  focus-events on        # let nvim autoread/focus events work

# Reload the config with: prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Split panes keeping the current directory, with more intuitive keys.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Catppuccin Mocha palette ─────────────────────────────────────────────────
# base=#1e1e2e mantle=#181825 crust=#11111b surface0=#313244 surface1=#45475a
# text=#cdd6f4 subtext0=#a6adc8 overlay0=#6c7086 blue=#89b4fa mauve=#cba6f7
# green=#a6e3a1 peach=#fab387 red=#f38ba8 yellow=#f9e2af lavender=#b4befe

# ── Base styling ─────────────────────────────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Message / command prompt.
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"

# Pane borders.
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# ── Status left: session name in a mauve pill ────────────────────────────────
set -g status-left-length 40
set -g status-left "#[bg=#cba6f7,fg=#11111b,bold]  #S #[bg=#1e1e2e,fg=#cba6f7]#[default] "

# ── Status right: date + time pills ──────────────────────────────────────────
set -g status-right-length 60
set -g status-right "#[fg=#89b4fa]#[bg=#89b4fa,fg=#11111b] 󰃭 %Y-%m-%d #[fg=#b4befe]#[bg=#b4befe,fg=#11111b]  %H:%M "

# ── Windows: inactive dim, active peach pill ─────────────────────────────────
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#a6adc8,bg=#1e1e2e]  #I:#W  "
setw -g window-status-current-format "#[bg=#1e1e2e,fg=#fab387]#[bg=#fab387,fg=#11111b,bold] #I:#W #[bg=#1e1e2e,fg=#fab387]"
