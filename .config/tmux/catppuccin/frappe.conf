# Catppuccin Frappé. Accent is mauve, matching nvim and the DMS shell.
# Swap flavours from .tmux.conf: this file is sourced by name.

set -g status-style 'bg=#303446,fg=#c6d0f5'
set -g status-left-style 'fg=#ca9ee6,bold'
set -g status-right-style 'fg=#a5adce'

set -g window-status-style 'fg=#a5adce'
set -g window-status-current-style 'bg=#ca9ee6,fg=#303446,bold'
set -g window-status-activity-style 'fg=#e5c890'
set -g window-status-bell-style 'fg=#e78284,bold'

set -g pane-border-style 'fg=#51576d'
set -g pane-active-border-style 'fg=#ca9ee6'
set -g display-panes-colour '#737994'
set -g display-panes-active-colour '#ca9ee6'

set -g message-style 'bg=#414559,fg=#c6d0f5'
set -g message-command-style 'bg=#414559,fg=#c6d0f5'

# Copy mode: the selection, plus search hits and the one under the cursor.
set -g mode-style 'bg=#626880,fg=#c6d0f5'
set -g copy-mode-match-style 'bg=#e5c890,fg=#303446'
set -g copy-mode-current-match-style 'bg=#ef9f76,fg=#303446'

set -g clock-mode-colour '#ca9ee6'
