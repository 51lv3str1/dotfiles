# Catppuccin Mocha. Accent is mauve, matching nvim and the DMS shell.
# Swap flavours from .tmux.conf: this file is sourced by name.

set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left-style 'fg=#cba6f7,bold'
set -g status-right-style 'fg=#a6adc8'

set -g window-status-style 'fg=#a6adc8'
set -g window-status-current-style 'bg=#cba6f7,fg=#1e1e2e,bold'
set -g window-status-activity-style 'fg=#f9e2af'
set -g window-status-bell-style 'fg=#f38ba8,bold'

set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#cba6f7'
set -g display-panes-colour '#6c7086'
set -g display-panes-active-colour '#cba6f7'

set -g message-style 'bg=#313244,fg=#cdd6f4'
set -g message-command-style 'bg=#313244,fg=#cdd6f4'

# Copy mode: the selection, plus search hits and the one under the cursor.
set -g mode-style 'bg=#585b70,fg=#cdd6f4'
set -g copy-mode-match-style 'bg=#f9e2af,fg=#1e1e2e'
set -g copy-mode-current-match-style 'bg=#fab387,fg=#1e1e2e'

set -g clock-mode-colour '#cba6f7'
