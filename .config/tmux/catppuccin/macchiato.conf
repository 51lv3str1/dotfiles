# Catppuccin Macchiato. Accent is mauve, matching nvim and the DMS shell.
# Swap flavours from .tmux.conf: this file is sourced by name.

set -g status-style 'bg=#24273a,fg=#cad3f5'
set -g status-left-style 'fg=#c6a0f6,bold'
set -g status-right-style 'fg=#a5adcb'

set -g window-status-style 'fg=#a5adcb'
set -g window-status-current-style 'bg=#c6a0f6,fg=#24273a,bold'
set -g window-status-activity-style 'fg=#eed49f'
set -g window-status-bell-style 'fg=#ed8796,bold'

set -g pane-border-style 'fg=#494d64'
set -g pane-active-border-style 'fg=#c6a0f6'
set -g display-panes-colour '#6e738d'
set -g display-panes-active-colour '#c6a0f6'

set -g message-style 'bg=#363a4f,fg=#cad3f5'
set -g message-command-style 'bg=#363a4f,fg=#cad3f5'

# Copy mode: the selection, plus search hits and the one under the cursor.
set -g mode-style 'bg=#5b6078,fg=#cad3f5'
set -g copy-mode-match-style 'bg=#eed49f,fg=#24273a'
set -g copy-mode-current-match-style 'bg=#f5a97f,fg=#24273a'

set -g clock-mode-colour '#c6a0f6'
