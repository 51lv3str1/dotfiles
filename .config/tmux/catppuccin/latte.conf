# Catppuccin Latte. Accent is mauve, matching nvim and the DMS shell.
# Swap flavours from .tmux.conf: this file is sourced by name.

set -g status-style 'bg=#eff1f5,fg=#4c4f69'
set -g status-left-style 'fg=#8839ef,bold'
set -g status-right-style 'fg=#6c6f85'

set -g window-status-style 'fg=#6c6f85'
set -g window-status-current-style 'bg=#8839ef,fg=#eff1f5,bold'
set -g window-status-activity-style 'fg=#df8e1d'
set -g window-status-bell-style 'fg=#d20f39,bold'

set -g pane-border-style 'fg=#bcc0cc'
set -g pane-active-border-style 'fg=#8839ef'
set -g display-panes-colour '#9ca0b0'
set -g display-panes-active-colour '#8839ef'

set -g message-style 'bg=#ccd0da,fg=#4c4f69'
set -g message-command-style 'bg=#ccd0da,fg=#4c4f69'

# Copy mode: the selection, plus search hits and the one under the cursor.
set -g mode-style 'bg=#acb0be,fg=#4c4f69'
set -g copy-mode-match-style 'bg=#df8e1d,fg=#eff1f5'
set -g copy-mode-current-match-style 'bg=#fe640b,fg=#eff1f5'

set -g clock-mode-colour '#8839ef'
