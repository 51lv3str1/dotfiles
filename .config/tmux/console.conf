# The bare console has 16 colours, where Catppuccin's hex values all collapse
# toward blue. Same layout as the flavours, in names the tty can draw.
# Accent is magenta, the nearest thing the console has to mauve.

set -g status-style 'bg=black,fg=white'
set -g status-left-style 'fg=brightmagenta,bold'
set -g status-right-style 'fg=brightblack'

set -g window-status-style 'fg=white'
set -g window-status-current-style 'bg=magenta,fg=black,bold'
set -g window-status-activity-style 'fg=yellow'
set -g window-status-bell-style 'fg=red,bold'

set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=magenta'
set -g display-panes-colour 'brightblack'
set -g display-panes-active-colour 'magenta'

set -g message-style 'bg=brightblack,fg=white'
set -g message-command-style 'bg=brightblack,fg=white'

# Copy mode: the selection, plus search hits and the one under the cursor.
set -g mode-style 'bg=brightblack,fg=white'
set -g copy-mode-match-style 'bg=yellow,fg=black'
set -g copy-mode-current-match-style 'bg=brightyellow,fg=black'

set -g clock-mode-colour 'magenta'
