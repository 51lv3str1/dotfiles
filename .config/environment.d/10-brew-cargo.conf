# Expose Homebrew + Cargo to the graphical session (systemd user manager).
# .zshrc/.bashrc only affect interactive shells; the desktop/app menu reads this.
# LINUX-ONLY: systemd/environment.d does not exist on macOS. Symlink this file
# from ~/.config/environment.d/ only on Linux; leave it unlinked on macOS.
PATH=/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:$HOME/.cargo/bin:$HOME/.local/bin${PATH:+:$PATH}
XDG_DATA_DIRS=/home/linuxbrew/.linuxbrew/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}
