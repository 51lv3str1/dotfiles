# PATH for desktop apps: GNOME launches them via the systemd user manager,
# which never reads a shell file. Applies at next login.
# No brew prefix here: it made `command -v brew` succeed before env.sh ran,
# silently skipping shellenv and losing HOMEBREW_PREFIX and the completions.
PATH=${HOME}/.cargo/bin:${HOME}/.local/bin:${HOME}/bin:${PATH}
