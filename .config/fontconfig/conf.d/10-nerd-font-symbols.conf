<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Departure Mono carries no Nerd Font icons, so nvim draws them as tofu.
       Borrow them from the symbols-only font, which supplies nothing else.

       The Mono variant, not the proportional one upstream's own config picks:
       in a terminal every glyph has to fit a single cell or the columns drift.

       Upstream ships this same rule for 372 font families at 48 KB. Two
       aliases cover this machine. -->
  <alias>
    <family>Departure Mono</family>
    <prefer><family>Symbols Nerd Font Mono</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Symbols Nerd Font Mono</family></prefer>
  </alias>
</fontconfig>
