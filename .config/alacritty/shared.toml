[env]
TERM = "xterm-256color"

[window]
decorations = "None"
padding = { x = 12, y = 12 }
opacity = 0.90
# Left Option sends Alt so terminal apps get Alt+key chords; right Option keeps
# composing special characters and accents.
option_as_alt = "OnlyLeft"

[scrolling]
history = 3023

[font]
size = 12.0
normal = { family = "DepartureMono Nerd Font" }

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = false

[bell]
duration = 0

[keyboard]
bindings = [
  { key = "C",       mods = "Control|Shift", action = "Copy"  },
  { key = "V",       mods = "Control|Shift", action = "Paste" },
  { key = "N",       mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "Equals",  mods = "Control|Shift", action = "IncreaseFontSize" },
  { key = "Minus",   mods = "Control",       action = "DecreaseFontSize" },
  { key = "Key0",    mods = "Control",       action = "ResetFontSize"    },
  { key = "Enter",   mods = "Shift",         chars = "\n" },
]

[debug]
# Drops the WARN level, whose only regular visitor is the spurious
# NSPasteboard#writeObjects failure on macOS -- the copy actually succeeds.
# Read once at startup, so a running instance keeps its old level.
log_level = "Error"
