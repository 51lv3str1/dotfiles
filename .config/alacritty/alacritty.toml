[general]
# Nothing but imports, and the order is the point: a later import replaces a
# field an earlier one set, while anything written *here* would beat them all.
# So the per-machine file goes last and this file stays empty.
import = [
  # Swap the flavour here: catppuccin/{mocha,macchiato,frappe,latte}.
  "~/.config/alacritty/catppuccin/mocha.toml",
  "~/.config/alacritty/shared.toml",
  # Git-ignored, and missing files are skipped silently: the phone sets its
  # own font size here, the desktops have no such file.
  "~/.config/alacritty/local.toml",
]
