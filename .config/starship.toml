"$schema" = 'https://starship.rs/config-schema.json'

# Swap the flavour here; all four palettes are defined at the end of the file.
# The palettes redefine green/red/yellow, so every module's default style picks
# up Catppuccin too. Names it has no equivalent for -- purple, bright-black --
# are the ones spelled out below.
palette = "catppuccin_mocha"

continuation_prompt = "[.](overlay0) "

[character]
success_symbol = "[>](bold green)"
error_symbol = "[x](bold red)"
vimcmd_symbol = "[<](bold green)"
vimcmd_visual_symbol = "[<](bold yellow)"
vimcmd_replace_symbol = "[<](bold mauve)"
vimcmd_replace_one_symbol = "[<](bold mauve)"

[git_commit]
tag_symbol = " tag "

[git_status]
ahead = ">"
behind = "<"
diverged = "<>"
renamed = "r"
deleted = "x"

[aws]
symbol = "aws "

[azure]
symbol = "az "

[battery]
