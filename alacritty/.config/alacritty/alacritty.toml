# Alacritty configuration — portable across macOS and Linux.
# No font family is pinned on purpose: Alacritty falls back to the system
# monospace, so this file never breaks on a machine that lacks a given font.
# Theme: Catppuccin Mocha (dark).

[window]
# "Buttonless" is macOS-only; on Linux it is ignored (behaves like Full).
decorations = "Buttonless"
padding = { x = 12, y = 12 }
opacity = 0.90

[scrolling]
history = 3023

[font]
# Only the size is set; family is intentionally left to the system default.
size = 13.0

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = false

[bell]
duration = 0

[keyboard]
bindings = [
  { key = "C",       mods = "Control|Shift", action = "Copy"  },
  { key = "V",       mods = "Control|Shift", action = "Paste" },
  { key = "N",       mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "Equals",  mods = "Control|Shift", action = "IncreaseFontSize" },
  { key = "Minus",   mods = "Control",       action = "DecreaseFontSize" },
  { key = "Key0",    mods = "Control",       action = "ResetFontSize"    },
  { key = "Enter",   mods = "Shift",         chars = "\n" },
  { key = "Up",      mods = "Shift",         action = "ScrollLineUp"   },
  { key = "Down",    mods = "Shift",         action = "ScrollLineDown" },
  { key = "K",       mods = "Control|Shift", action = "ScrollLineUp"   },
  { key = "J",       mods = "Control|Shift", action = "ScrollLineDown" },
]

